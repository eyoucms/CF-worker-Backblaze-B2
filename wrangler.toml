name = "cloudflare-b2"

workers_dev = true
compatibility_date = "2024-09-23"

main = "index.js"

# 所有环境变量与机密都在 Cloudflare 控制台（Worker → 设置 → 变量和机密）中添加，
# 不写在本文件里，以免把敏感信息提交到 Git 仓库。需要添加的内容见 README 第三节第 2 步：
#
#   环境变量（明文）：
#     BUCKET_NAME              你的桶名（写死，实现短链接，如 my-updates）
#     B2_ENDPOINT              S3 Endpoint，如 s3.us-west-001.backblazeb2.com（只填域名）
#     B2_APPLICATION_KEY_ID    应用密钥 ID（keyID）
#     CACHE_MAX_AGE            31536000（缓存 365 天）
#
#   机密（加密）：
#     B2_APPLICATION_KEY       应用密钥（applicationKey），切勿提交到仓库
#
# 可选：如需进一步限制参与 AWS v4 签名的请求头，可在控制台添加 ALLOWED_HEADERS（JSON 数组字符串），
# 例如 ["range","content-type","host","x-amz-content-sha256","x-amz-date"]。
